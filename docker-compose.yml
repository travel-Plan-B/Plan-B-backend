services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: plan_b_user
      POSTGRES_PASSWORD: plan_b_password
      POSTGRES_DB: plan_b
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://plan_b_user:plan_b_password@db:5432/plan_b
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: